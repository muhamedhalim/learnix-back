name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Typecheck, lint, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build

      - name: Unit tests (with coverage)
        run: npm run test:cov -- --ci --runInBand

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/
          if-no-files-found: ignore

  migration-chain:
    name: Migration chain (empty database)
    runs-on: ubuntu-latest
    # Proves the ENTIRE migration history applies cleanly to a genuinely empty
    # PostgreSQL database. The regular unit/E2E suites materialise their schema
    # with TYPEORM_SYNCHRONIZE=true (see the `e2e` job below), which builds
    # tables directly from entity metadata and therefore never actually runs
    # the migration files. That gap is exactly what src/database/seed-staging.ts
    # and a fresh staging database depend on never existing — see
    # docs/ENVIRONMENT_INVENTORY.md finding A-11 and scripts/migration-chain-test.ts.
    #
    # This job fails the PR if the chain fails to create the empty database,
    # fails ANY migration, or leaves migrations pending after the run —
    # scripts/migration-chain-test.ts asserts all three and exits non-zero on
    # any of them (see assertReport()).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run every migration against an empty database
        run: npm run test:migrations

  e2e:
    name: E2E tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lms_test
      # Test DB schema is materialised from entities (allowed outside production).
      TYPEORM_SYNCHRONIZE: 'true'
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: test-jwt-secret-value-at-least-32-chars-long
      JWT_REFRESH_SECRET: test-refresh-secret-value-at-least-32-chars
      COOKIE_SECRET: test-cookie-secret-value-at-least-32-chars-x
      BCRYPT_ROUNDS: '4'
      METRICS_BEARER_TOKEN: test-metrics-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm run test:e2e -- --ci --runInBand

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
