name: Deploy API to AWS (ECS)

# One image (linux/arm64) serves the api, worker and migrate task definitions. This workflow builds it
# with the Amazon RDS CA bundle baked in, scans it, pushes it to the target account's ECR under the
# commit SHA (immutable), then runs scripts/aws/ecs-deploy.sh (source of truth:
# learnix-infra/scripts/ecs-deploy.sh): migrate task first (must exit 0), then api + worker, with
# automatic rollback when a deployment fails or alarms fire.
#
#   push to develop      -> staging
#   workflow_dispatch    -> staging or production
#
# Production additionally requires: a successful staging deploy of the same commit, the migration
# classifier, a DB-owner approval for destructive migrations, and a manual RDS snapshot before migrating.
#
# GitHub environment variables (staging / production), from `terraform output` in learnix-infra:
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN (deploy_roles.api), ECR_REPOSITORY_URL (ecr_repositories.api),
#   ECS_CLUSTER (ecs_cluster), ECS_SERVICES ("api,worker" or "api" on single-role staging),
#   MIGRATE_FAMILY (migrate_task_definition_family), TASK_NETWORK (task_network, JSON),
#   ALARM_PREFIX (learnix-<env>), API_URL (api_url), DB_INSTANCE_ID (production only)
# Nothing secret is stored here: the job assumes the deploy role through GitHub OIDC.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.environment || 'staging' }}

jobs:
  gates:
    name: Promotion gates
    runs-on: ubuntu-latest
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Production needs a green staging deploy of this commit
        if: env.TARGET == 'production'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Push-triggered runs only ever target staging (push to develop).
        run: |
          staging=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy-aws.yml/runs?head_sha=${{ github.sha }}&status=success&event=push&per_page=5" \
            --jq '.total_count')
          if [ "${staging:-0}" -lt 1 ]; then
            echo "::error::No successful staging deploy of ${{ github.sha }}; deploy it to staging first."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Classify migration changes
        id: classify
        run: |
          set +e
          npx ts-node scripts/migration-safety-check.ts --base "origin/main~1"
          code=$?
          set -e
          case "$code" in
            0) echo "classification=SAFE" >> "$GITHUB_OUTPUT" ;;
            1) echo "classification=NEEDS_DB_APPROVAL" >> "$GITHUB_OUTPUT" ;;
            *) echo "classification=BLOCKED" >> "$GITHUB_OUTPUT"; exit 1 ;;
          esac

  db-owner-approval:
    name: Database-owner approval (destructive migration)
    needs: gates
    if: needs.gates.outputs.classification == 'NEEDS_DB_APPROVAL' && (inputs.environment || 'staging') == 'production'
    runs-on: ubuntu-latest
    environment: production-db-approval
    steps:
      - run: echo "Destructive migration approved through the production-db-approval environment."

  deploy:
    name: Build, migrate and roll out
    needs: [gates, db-owner-approval]
    if: always() && needs.gates.result == 'success' && (needs.db-owner-approval.result == 'success' || needs.db-owner-approval.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse an unconfigured environment
        env:
          REQUIRED: AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY_URL ECS_CLUSTER ECS_SERVICES MIGRATE_FAMILY TASK_NETWORK
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICES: ${{ vars.ECS_SERVICES }}
          MIGRATE_FAMILY: ${{ vars.MIGRATE_FAMILY }}
          TASK_NETWORK: ${{ vars.TASK_NETWORK }}
        run: |
          for v in $REQUIRED; do
            [ -n "${!v}" ] || { echo "::error::GitHub environment variable $v is not set"; exit 1; }
          done

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build (linux/arm64, RDS CA bundle included)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            RDS_CA_BUNDLE_URL=https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem

      - name: Scan the image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push (immutable tag = commit)
        run: docker push "$IMAGE"

      # Production only: a manual snapshot before migrations run. Replaces the old GitHub-artifact
      # pg_dump, which copied production personal data out of the database account.
      - name: Pre-deploy database snapshot
        if: env.TARGET == 'production'
        run: |
          id="pre-deploy-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          aws rds create-db-snapshot --db-instance-identifier "${{ vars.DB_INSTANCE_ID }}" --db-snapshot-identifier "$id" \
            --tags Key=Purpose,Value=pre-deploy Key=Commit,Value=${{ github.sha }} >/dev/null
          aws rds wait db-snapshot-available --db-snapshot-identifier "$id"
          echo "Snapshot $id is available."

      - name: Migrate, then roll out (automatic rollback)
        run: |
          bash scripts/aws/ecs-deploy.sh \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICES }}" \
            --image "$IMAGE" \
            --migrate-family "${{ vars.MIGRATE_FAMILY }}" \
            --network '${{ vars.TASK_NETWORK }}' \
            --alarm-prefix "${{ vars.ALARM_PREFIX }}"

      - name: Keep the rollback point
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previous-task-definitions-api-${{ env.TARGET }}-${{ github.sha }}
          path: previous-task-definitions.json
          if-no-files-found: ignore
          retention-days: 30

      # Staging is behind a WAF IP allowlist that GitHub's runners are not on; enable per environment.
      - name: Read-only smoke test of the API host through CloudFront
        if: vars.SMOKE_FROM_RUNNER == 'true'
        run: bash scripts/smoke-test.sh "${{ vars.API_URL }}"
