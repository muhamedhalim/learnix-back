name: tf-drift

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-org:
    if: ${{ vars.AWS_PLAN_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Write backend and variable files
        working-directory: org
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          region       = "${{ vars.AWS_REGION }}"
          encrypt      = true
          kms_key_id   = "${{ vars.TF_STATE_KMS_KEY_ARN }}"
          use_lockfile = true
          EOF
          printf '%s' '${{ vars.ORG_TFVARS_JSON }}' > ci.auto.tfvars.json
      - run: terraform init -input=false -backend-config=backend.hcl
        working-directory: org
      - name: Plan (exit code 2 = drift, fails the job so GitHub notifies)
        working-directory: org
        run: terraform plan -input=false -lock=false -detailed-exitcode

  drift-staging:
    if: ${{ vars.STAGING_PLAN_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.STAGING_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Write backend and variable files
        working-directory: environments/staging
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.STAGING_TF_STATE_BUCKET }}"
          region       = "${{ vars.AWS_REGION }}"
          encrypt      = true
          kms_key_id   = "${{ vars.STAGING_TF_STATE_KMS_KEY_ARN }}"
          use_lockfile = true
          EOF
          printf '%s' '${{ vars.STAGING_TFVARS_JSON }}' > ci.auto.tfvars.json
      - run: terraform init -input=false -backend-config=backend.hcl
        working-directory: environments/staging
      - name: Plan (exit code 2 = drift, fails the job so GitHub notifies)
        working-directory: environments/staging
        run: terraform plan -input=false -lock=false -detailed-exitcode

  drift-production:
    if: ${{ vars.PRODUCTION_PLAN_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PRODUCTION_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Write backend and variable files
        working-directory: environments/production
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.PRODUCTION_TF_STATE_BUCKET }}"
          region       = "${{ vars.AWS_REGION }}"
          encrypt      = true
          kms_key_id   = "${{ vars.PRODUCTION_TF_STATE_KMS_KEY_ARN }}"
          use_lockfile = true
          EOF
          printf '%s' '${{ vars.PRODUCTION_TFVARS_JSON }}' > ci.auto.tfvars.json
      - run: terraform init -input=false -backend-config=backend.hcl
        working-directory: environments/production
      - name: Plan (exit code 2 = drift, fails the job so GitHub notifies)
        working-directory: environments/production
        run: terraform plan -input=false -lock=false -detailed-exitcode
