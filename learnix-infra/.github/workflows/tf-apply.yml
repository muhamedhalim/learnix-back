name: tf-apply-org

# Manual trigger only. The apply job runs in the GitHub environment `infra-management`,
# which must have required reviewers. It applies the exact plan produced by the plan job.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tf-org
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Write backend and variable files
        working-directory: org
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          region       = "${{ vars.AWS_REGION }}"
          encrypt      = true
          kms_key_id   = "${{ vars.TF_STATE_KMS_KEY_ARN }}"
          use_lockfile = true
          EOF
          printf '%s' '${{ vars.ORG_TFVARS_JSON }}' > ci.auto.tfvars.json
      - run: terraform init -input=false -backend-config=backend.hcl
        working-directory: org
      - run: terraform plan -input=false -lock-timeout=60s -out=tfplan
        working-directory: org
      - name: Policy check (conftest)
        working-directory: org
        run: |
          terraform show -json tfplan > tfplan.json
          docker run --rm -v "$PWD/..:/project" -w /project openpolicyagent/conftest:v0.56.0 \
            test --policy policies --parser json org/tfplan.json
      - uses: actions/upload-artifact@v4
        with:
          name: org-tfplan
          path: |
            org/tfplan
            org/backend.hcl
            org/ci.auto.tfvars.json
          retention-days: 3

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: infra-management
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: org-tfplan
          path: org
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -input=false -backend-config=backend.hcl
        working-directory: org
      - run: terraform apply -input=false -lock-timeout=60s tfplan
        working-directory: org
