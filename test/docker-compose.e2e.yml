services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lms_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lms_e2e_password
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lms_e2e']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data
